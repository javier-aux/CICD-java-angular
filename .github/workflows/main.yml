on:
  push:
    branches:
    - main
jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: copiar codigo
        uses: actions/checkout@v4
      - name: ejecutando test
        run: |
          cd emp_backend
          mvn test
  build:
    needs: test
    runs-on: self-hosted
    steps:
      - name: copiar codigo
        uses: actions/checkout@v4
      - name: construyendo imagenes
        run: |
            docker compose build --no-cache
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: copiar codigo
        uses: actions/checkout@v4
      - name: construyendo contenedores
        run: |
            docker compose up -d
          
                    
    
